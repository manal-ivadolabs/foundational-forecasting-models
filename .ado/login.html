<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login required</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: white; padding: 2rem 3rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
    a.btn { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.4rem; background: #0078d4; color: white; text-decoration: none; border-radius: 4px; }
    a.btn:hover { background: #106ebe; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Access restricted</h2>
    <p>Please sign in with your Microsoft account to view this documentation.</p>
    <a class="btn" href="/.auth/login/aad?post_login_redirect_uri=/">Sign in</a>
  </div>
</body>
</html>
