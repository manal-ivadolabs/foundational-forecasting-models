trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: common-vars

stages:
  # TODO: Build and push any artifacts (e.g., container images, packages) tagged with $(Build.SourceVersion)

  - stage: deploy_dev
    displayName: Deploy to dev
    jobs:
      - template: ../templates/deploy-job.yaml
        parameters:
          environment: dev
          version: $(Build.SourceVersion)
          pool_provider_name: $(POOL_PROVIDER_NAME)
