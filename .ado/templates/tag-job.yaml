parameters:
  - name: release_type
    type: string
    default: patch
    values:
      - major
      - minor
      - patch

jobs:
  - job: tag
    displayName: Create semver tag
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 0
        fetchTags: true

      - script: |
          set -euo pipefail
          new_version=$(bash scripts/semver.sh "$RELEASE_TYPE")
          echo "New version: $new_version"
          echo "##vso[task.setvariable variable=version;isOutput=true]$new_version"
        displayName: Determine new version
        name: determine_version
        env:
          RELEASE_TYPE: ${{ parameters.release_type }}

      - script: |
          set -euo pipefail
          git config user.email "azure-pipelines[bot]@users.noreply.visualstudio.com"
          git config user.name "azure-pipelines[bot]"
          VERSION="$(determine_version.version)"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "##vso[task.logissue type=error]Tag $VERSION already exists. Delete it via the UI (Repos > Tags > ... > Delete) or with: git push origin --delete $VERSION"
            exit 1
          fi
          git tag "$VERSION"
          git push origin "$VERSION"
        displayName: Create and push Git tag

      # TODO: Tag any other artifacts (e.g., container images, packages) with $(determine_version.version)
