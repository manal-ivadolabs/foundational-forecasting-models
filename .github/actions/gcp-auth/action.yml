name: Authenticate to Google Cloud via WIF
description: Authenticates to GCP using Workload Identity Federation and sets up gcloud.

inputs:
  workload_identity_provider:
    description: Workload Identity Provider resource name
    default: projects/721076156206/locations/global/workloadIdentityPools/ivado-labs-github-org/providers/ivado-labs-github-org
  project_id:
    description: GCP project ID
    default: "721076156206"

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        project_id: ${{ inputs.project_id }}

    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
