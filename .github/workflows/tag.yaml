name: Tag

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select the type of release'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

  workflow_call:
    inputs:
      release_type:
        description: 'major, minor, or patch'
        required: true
        type: string
    outputs:
      version:
        description: 'The new semver version created (e.g., 1.2.3)'
        value: ${{ jobs.tag.outputs.version }}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine_version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Determine new version
      id: determine_version
      run: |
        new_version=$(bash scripts/semver.sh "${{ inputs.release_type }}")
        echo "version=$new_version" >> $GITHUB_OUTPUT

    - name: Create Git tag
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        VERSION="${{ steps.determine_version.outputs.version }}"
        if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
          TAGGED_COMMIT=$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAGGED_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "Tag $VERSION already exists on this commit, reusing it."
          else
            echo "::error::Tag $VERSION already exists on a different commit. Delete it first: git push origin --delete $VERSION"
            exit 1
          fi
        else
          git tag "$VERSION"
          git push origin "$VERSION"
        fi

    # TODO: Tag any other artifacts (e.g., container images, packages) with ${{ env.NEW_VERSION }}
