[build-system]
requires = ["setuptools", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "project_name_to_change"
dynamic = ["version"]
description = "REPLACE ME"
authors = [{name = "Ivado Labs"}]
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "il-kickstart>=0.11.4",
]

[tool.setuptools_scm]

[dependency-groups]
test = [
    "genbadge[coverage]>=1.1.3",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.1.5",
]
dev = [
    "commitizen>=4.10.0",
    "ty>=0.0.35",
    "prek>=0.3.3",
    "ruff>=0.13.2",
    "il-supply-chain-security>=0.2.3",
]
docs = [
    "zensical",
]
ui = [
    "streamlit>=1.54.0",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { il-kickstart = false, il-supply-chain-security = false }
keyring-provider = "subprocess"

[tool.uv.sources]
il-kickstart = { index = "gcp-private" }
il-supply-chain-security = { index = "gcp-private" }

[[tool.uv.index]]
name = "gcp-private"
url = "https://oauth2accesstoken@northamerica-northeast1-python.pkg.dev/il-registry/il-py-index/simple/"
authenticate = "always"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["project_name_to_change"]
exclude = ["infra", "notebooks"]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["tests/utils"]
env = ["KICKSTART_NAME_OVERWRITE=TEST"]
addopts = """
--disable-warnings -W ignore::DeprecationWarning
--junitxml=reports/junit/junit.xml
--cov=project_name_to_change
--cov-branch
--cov-report=xml:reports/coverage/coverage.xml
--cov-report=term-missing
"""
testpaths = ["tests"]

[tool.coverage.run]
source = ["project_name_to_change"]

[tool.coverage.report]
include_namespace_packages = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["tests/", ".agents/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "PGH",  # pygrep-hooks
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions rules
    "A",    # flake8-builtins
    "PTH",  # flake8-use-pathlib (over os)
    "COM",  # flake8-commas
    "ICN",  # flake8-import-conventions
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "B",    # flake8-boolean-trap
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "RET",  # flake8-return
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "RSE",  # flake8-raise
    "PD",   # pandas
    "NPY",  # numpy
    "C90",  # mccabe
    "ERA",  # eradicate (removes commented-out code from Python files)
    "D",    # pydocstyle
    "N",    # pep8-naming
    "PL",   # Pylint
    "FLY",  # flynt
    "PERF", # Perflint
    "RUF",  # Ruff-specific rules

    # Cherry-pick specific rules
    "Q004",   # flake8-quotes (Only rule compatible with formatter)
    "TID252", # relative-imports
]
extend-safe-fixes = ["C4"]
ignore = [
    "D414", # empty-docstring-section
    "D10",  # Missing docstring
    # The following rules are disabled because they are not compatible with the formatter.
    # See https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # Indentation contains tabs
    "E111",   # Indentation with invalid number of spaces
    "E114",   # Indentation with invalid number of spaces for comments
    "E117",   # Over-indented
    "D206",   # Indentation contains tabs for docstrings
    "D300",   # Use """triple double quotes""" instead of '''triple single quotes'''
    "COM812", # Missing trailing comma
    "COM819", # Removes unnecessary trailing commas
    "RET504", # unnecessary-assign at the end
]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]    # Unused imports
"tests/**.py" = ["S101"]  # Use of `assert` detected
"*.ipynb" = ["T201"]  # Allow print statements in notebooks

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true             # Return type on __init__
suppress-none-returning = true      # Missing "-> None"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"       # Disallow all relative imports
